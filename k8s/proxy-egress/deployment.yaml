apiVersion: v1
kind: Service
metadata:
  name: proxy-egress
  labels:
    app.kubernetes.io/name: proxy-egress
    app.kubernetes.io/component: proxy-egress
spec:
  type: ClusterIP
  ports:
    - name: http-proxy
      port: 3128
      targetPort: 3128
  selector:
    app.kubernetes.io/name: proxy-egress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-egress
  labels:
    app.kubernetes.io/name: proxy-egress
    app.kubernetes.io/component: proxy-egress
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: proxy-egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proxy-egress
        app.kubernetes.io/component: proxy-egress
    spec:
      containers:
        - name: squid
          image: registry.tjse.jus.br/segportal/egress-proxy:latest
          ports:
            - containerPort: 3128
              name: http-proxy
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 3128
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3128
            initialDelaySeconds: 5
            periodSeconds: 5
