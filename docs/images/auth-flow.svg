<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="420" fill="#f4f7fa"/>
  <rect width="800" height="48" fill="#003366"/>
  <text x="20" y="32" fill="#fff" font-size="16" font-weight="700">Fluxo de autenticação LDAP + MFA</text>

  <!-- Swimlanes -->
  <rect x="20" y="60" width="140" height="340" fill="#fff" stroke="#d8e0e8" rx="6"/>
  <rect x="180" y="60" width="140" height="340" fill="#fff" stroke="#d8e0e8" rx="6"/>
  <rect x="340" y="60" width="140" height="340" fill="#fff" stroke="#d8e0e8" rx="6"/>
  <rect x="500" y="60" width="140" height="340" fill="#fff" stroke="#d8e0e8" rx="6"/>
  <rect x="660" y="60" width="120" height="340" fill="#fff" stroke="#d8e0e8" rx="6"/>

  <text x="90" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#003366">Usuário</text>
  <text x="250" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#003366">Guacamole</text>
  <text x="410" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#003366">LDAP AD</text>
  <text x="570" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#003366">RADIUS MFA</text>
  <text x="720" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#003366">guacd</text>

  <!-- Steps -->
  <rect x="40" y="110" width="100" height="36" rx="6" fill="#e3f0ff" stroke="#003366"/>
  <text x="90" y="133" text-anchor="middle" font-size="10">1. Login</text>

  <rect x="200" y="110" width="100" height="36" rx="6" fill="#003366"/>
  <text x="250" y="128" text-anchor="middle" font-size="9" fill="#fff">Recebe credenciais</text>

  <rect x="200" y="170" width="100" height="36" rx="6" fill="#003366"/>
  <text x="250" y="188" text-anchor="middle" font-size="9" fill="#fff">Bind LDAP</text>

  <rect x="360" y="170" width="100" height="36" rx="6" fill="#fff" stroke="#003366"/>
  <text x="410" y="188" text-anchor="middle" font-size="9">Valida user+grupos</text>

  <rect x="200" y="230" width="100" height="36" rx="6" fill="#003366"/>
  <text x="250" y="248" text-anchor="middle" font-size="9" fill="#fff">Access-Request</text>

  <rect x="520" y="230" width="100" height="36" rx="6" fill="#fff" stroke="#C4A035" stroke-width="2"/>
  <text x="570" y="248" text-anchor="middle" font-size="9">Verifica MFA</text>

  <rect x="520" y="290" width="100" height="36" rx="6" fill="#e8f5e9" stroke="#1b7f4a"/>
  <text x="570" y="308" text-anchor="middle" font-size="9">Access-Accept</text>

  <rect x="40" y="290" width="100" height="36" rx="6" fill="#e8f5e9" stroke="#1b7f4a"/>
  <text x="90" y="308" text-anchor="middle" font-size="10">2. Portal OK</text>

  <rect x="40" y="350" width="100" height="36" rx="6" fill="#e3f0ff" stroke="#003366"/>
  <text x="90" y="368" text-anchor="middle" font-size="10">3. Conectar</text>

  <rect x="680" y="350" width="80" height="36" rx="6" fill="#003366"/>
  <text x="720" y="368" text-anchor="middle" font-size="9" fill="#fff">Sessão</text>

  <!-- Arrows -->
  <path d="M140 128 L195 128" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M250 146 L250 165" stroke="#333" stroke-width="1.5"/>
  <path d="M300 188 L355 188" stroke="#333" stroke-width="1.5"/>
  <path d="M410 206 L410 220 L250 220 L250 230" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M300 248 L515 248" stroke="#333" stroke-width="1.5"/>
  <path d="M570 266 L570 285" stroke="#333" stroke-width="1.5"/>
  <path d="M520 308 L250 308 L140 308" stroke="#1b7f4a" stroke-width="1.5"/>
  <path d="M90 326 L90 345" stroke="#333" stroke-width="1.5"/>
  <path d="M140 368 L675 368" stroke="#003366" stroke-width="2"/>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#333"/></marker></defs>
</svg>
