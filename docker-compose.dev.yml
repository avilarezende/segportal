# SegPortal — demonstração local (SEM LDAP / SEM MFA)
# No boot o navegador Firefox via VNC já fica habilitado para todos.
#
# Uso:
#   docker compose -f docker-compose.dev.yml up --build
#   Acesse: http://localhost:8080/guacamole
#   Admin:   guacadmin / guacadmin
#   Usuário: usuario / usuario
#   Conexão padrão: "Navegador Web SegPortal"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole_user -d guacamole_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped

  web-browser:
    build:
      context: services/web-browser
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DISPLAY_WIDTH: "1280"
      DISPLAY_HEIGHT: "800"
      VNC_PORT: "5900"
      # Deve coincidir com o parâmetro password da conexão Guacamole (004-default-browser.sql)
      VNC_PASSWORD: segport1
      FF_OPEN_URL: https://example.com
    expose:
      - "5900"
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5900 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  segportal-bootstrap:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_HOSTNAME: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: devpassword
      SEGPORTAL_BOOTSTRAP_WAIT_SECONDS: "300"
      GUACAMOLE_VERSION: "1.5.5"
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/bootstrap-segportal.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  guacamole:
    image: guacamole/guacamole:1.5.5
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOSTNAME: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: devpassword
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_started
      web-browser:
        condition: service_healthy
      segportal-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/guacamole/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

volumes:
  postgres-dev-data:
