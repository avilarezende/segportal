# SegPortal — demonstração local (SEM LDAP / SEM MFA)
# No boot o navegador Firefox via VNC já fica habilitado para todos.
#
# Uso:
#   docker compose -f docker-compose.dev.yml up --build
#   Acesse: http://localhost:8080/guacamole
#   Credenciais próprias via ambiente; não há senhas demo embutidas.
#   Conexão padrão: "Navegador Web SegPortal"

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina senha própria do banco de desenvolvimento}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole_user -d guacamole_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  guacd:
    image: guacamole/guacd:1.5.5@sha256:38232cae271361ef53db46faf5c49fe64049a1320a05b82c597425b69d6ce77e
    restart: unless-stopped

  web-browser:
    build:
      context: services/web-browser
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DISPLAY_WIDTH: "1280"
      DISPLAY_HEIGHT: "800"
      VNC_PORT: "5900"
      # Deve coincidir com SEGPORTAL_VNC_PASSWORD usado pelo bootstrap no SQL 004
      VNC_PASSWORD: ${VNC_PASSWORD:?Defina VNC_PASSWORD e SEGPORTAL_VNC_PASSWORD no ambiente}
      FF_OPEN_URL: https://example.com
    expose:
      - "5900"
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5900 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  segportal-bootstrap:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: "no"
    environment:
      POSTGRES_HOSTNAME: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina senha própria do banco de desenvolvimento}
      SEGPORTAL_BOOTSTRAP_WAIT_SECONDS: "300"
      GUACAMOLE_VERSION: "1.5.5"
      GUACAMOLE_ADMIN_PASSWORD: ${GUACAMOLE_ADMIN_PASSWORD:?Defina senha própria do admin}
      SEGPORTAL_VNC_PASSWORD: ${SEGPORTAL_VNC_PASSWORD:?Defina senha VNC}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/bootstrap-segportal.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  guacamole:
    image: guacamole/guacamole:1.5.5@sha256:0f62f6d17ab379e46aa66874b2ff564dab856a6ef5e754a69cbb34c32d3e588a
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      POSTGRES_HOSTNAME: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina senha própria do banco de desenvolvimento}
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_started
      web-browser:
        condition: service_healthy
      segportal-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/guacamole/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

volumes:
  postgres-dev-data:
