# SegPortal — modo de demonstração local (SEM LDAP e SEM MFA)
# Login após seed-roles.sh:
#   Admin   → guacadmin / guacadmin  (vê sessões, configura conexões)
#   Usuário → usuario   / usuario    (somente o próprio contexto)
#
# Uso:
#   docker compose -f docker-compose.dev.yml up --build
#   # após o schema inicializar:
#   docker compose -f docker-compose.dev.yml exec -T postgres \
#     psql -U guacamole_user -d guacamole_db < scripts/sql/003-segportal-roles.sql
#   Acesse: http://localhost:8080/guacamole

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole_user -d guacamole_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped

  guacamole:
    image: guacamole/guacamole:1.5.5
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # PostgreSQL
      POSTGRES_HOSTNAME: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: devpassword
      # guacd
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      # Inicializa o schema automaticamente (imagem oficial)
      POSTGRES_INIT_DB: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/guacamole/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

volumes:
  postgres-dev-data:
