# SegPortal TJSE — LDAP / Active Directory configuration reference
# Used by Guacamole LDAP extension and portal-auth integration.

# Domain
ldap.domain=tjse.jus.br
ldap.base-dn=DC=tjse,DC=jus,DC=br

# User search
ldap.user-base-dn=OU=Usuarios,DC=tjse,DC=jus,DC=br
ldap.username-attribute=sAMAccountName
ldap.display-name-attribute=displayName
ldap.email-attribute=mail
ldap.member-attribute=memberOf

# Service account (search bind)
ldap.search-bind-dn=CN=svc-segportal,OU=Servicos,DC=tjse,DC=jus,DC=br
# ldap.search-bind-password — set via secret / environment

# Connection
ldap.hostname=ldap.tjse.jus.br
ldap.port=636
ldap.encryption-method=ssl
ldap.trust-certificate=true

# Group mapping for Guacamole connections
ldap.group-base-dn=OU=Grupos,DC=tjse,DC=jus,DC=br
ldap.group-search-filter=(objectClass=group)

# SegPortal AD groups (examples)
ldap.groups.segportal-financeiro=GG-SegPortal-Financeiro
ldap.groups.segportal-consulta=GG-SegPortal-Consulta
ldap.groups.segportal-admin=GG-SegPortal-Admin

# MFA
mfa.enabled=true
mfa.radius.host=radius.tjse.jus.br
mfa.radius.port=1812
# mfa.radius.secret — set via secret / environment
