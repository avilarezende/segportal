# SegPortal AQNE — LDAP / Active Directory (referência)
# Apontamentos editáveis: config/ldap/ldap-settings.yaml
# Runtime: variáveis LDAP_* + LDAP_ENABLED (ver docs/LOCAL_ADMIN.md)

# Liga/desliga (espelha LDAP_ENABLED)
ldap.enabled=false

# Domain
ldap.domain=aqne.jus.br
ldap.base-dn=DC=aqne,DC=jus,DC=br

# User search
ldap.user-base-dn=OU=Usuarios,DC=aqne,DC=jus,DC=br
ldap.username-attribute=sAMAccountName
ldap.display-name-attribute=displayName
ldap.email-attribute=mail
ldap.member-attribute=memberOf

# Service account (search bind)
ldap.search-bind-dn=CN=svc-segportal,OU=Servicos,DC=aqne,DC=jus,DC=br
# ldap.search-bind-password — Secret / environment

# Connection
ldap.hostname=ldap.aqne.jus.br
ldap.port=636
ldap.encryption-method=ssl
ldap.trust-certificate=true
ldap.ca-chain-file=/etc/guacamole/certs/ldap-ca-chain.pem
ldap.server-certificate-file=

# Group mapping
ldap.group-base-dn=OU=Grupos,DC=aqne,DC=jus,DC=br
ldap.group-search-filter=(objectClass=group)

# Papéis
ldap.groups.segportal-admin=GG-SegPortal-Admin
ldap.groups.segportal-usuarios=GG-SegPortal-Usuarios
ldap.groups.segportal-financeiro=GG-SegPortal-Financeiro
ldap.groups.segportal-consulta=GG-SegPortal-Consulta
ldap.groups.segportal-externo=GG-SegPortal-Externo

# MFA (opcional)
mfa.enabled=false
mfa.radius.host=radius.aqne.jus.br
mfa.radius.port=1812
