# SegPortal TJSE — Apache Guacamole configuration
# Environment variables are expanded by entrypoint.sh at container start.

# PostgreSQL backend
postgresql-hostname: ${POSTGRES_HOSTNAME:postgres}
postgresql-port: ${POSTGRES_PORT:5432}
postgresql-database: ${POSTGRES_DB:guacamole_db}
postgresql-username: ${POSTGRES_USER:guacamole_user}
postgresql-password: ${POSTGRES_PASSWORD}

# Session and security
api-session-timeout: ${SESSION_TIMEOUT_MINUTES:60}
max-concurrent-connections: ${MAX_CONCURRENT_CONNECTIONS:3}
skip-if-unavailable: postgresql,ldap

# LDAP authentication (extension guacamole-auth-ldap)
ldap-hostname: ${LDAP_HOSTNAME}
ldap-port: ${LDAP_PORT:636}
ldap-encryption-method: ${LDAP_ENCRYPTION_METHOD:ssl}
ldap-user-base-dn: ${LDAP_USER_BASE_DN}
ldap-username-attribute: ${LDAP_USERNAME_ATTRIBUTE:sAMAccountName}
ldap-search-bind-dn: ${LDAP_SEARCH_BIND_DN}
ldap-search-bind-password: ${LDAP_SEARCH_BIND_PASSWORD}
ldap-user-search-filter: (objectClass=user)

# MFA via RADIUS (when enabled)
radius-hostname: ${MFA_RADIUS_HOST:}
radius-port: ${MFA_RADIUS_PORT:1812}
radius-shared-secret: ${MFA_RADIUS_SECRET:}
radius-auth-protocol: pap

# Egress proxy for authorized HTTP navigation
http-proxy-hostname: ${EGRESS_PROXY_HOST:proxy-egress}
http-proxy-port: ${EGRESS_PROXY_PORT:3128}

# Branding
guacd-hostname: ${GUACD_HOSTNAME:guacd}
guacd-port: ${GUACD_PORT:4822}
