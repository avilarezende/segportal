# SegPortal TJSE — Apache Guacamole configuration
# Environment variables are expanded by entrypoint.sh (envsubst) at container
# start; defaults for optional variables are provided by entrypoint.sh.

# PostgreSQL backend
postgresql-hostname: ${POSTGRES_HOSTNAME}
postgresql-port: ${POSTGRES_PORT}
postgresql-database: ${POSTGRES_DB}
postgresql-username: ${POSTGRES_USER}
postgresql-password: ${POSTGRES_PASSWORD}

# Session and security
api-session-timeout: ${SESSION_TIMEOUT_MINUTES}
max-concurrent-connections: ${MAX_CONCURRENT_CONNECTIONS}
skip-if-unavailable: postgresql,ldap

# LDAP authentication (extension guacamole-auth-ldap)
ldap-hostname: ${LDAP_HOSTNAME}
ldap-port: ${LDAP_PORT}
ldap-encryption-method: ${LDAP_ENCRYPTION_METHOD}
ldap-user-base-dn: ${LDAP_USER_BASE_DN}
ldap-username-attribute: ${LDAP_USERNAME_ATTRIBUTE}
ldap-search-bind-dn: ${LDAP_SEARCH_BIND_DN}
ldap-search-bind-password: ${LDAP_SEARCH_BIND_PASSWORD}
ldap-user-search-filter: (objectClass=user)

# MFA via RADIUS (when enabled)
radius-hostname: ${MFA_RADIUS_HOST}
radius-port: ${MFA_RADIUS_PORT}
radius-shared-secret: ${MFA_RADIUS_SECRET}
radius-auth-protocol: pap

# Egress proxy for authorized HTTP navigation
http-proxy-hostname: ${EGRESS_PROXY_HOST}
http-proxy-port: ${EGRESS_PROXY_PORT}

# guacd (protocol daemon)
guacd-hostname: ${GUACD_HOSTNAME}
guacd-port: ${GUACD_PORT}
