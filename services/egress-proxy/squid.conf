# SegPortal AQNE — Squid egress proxy (container image)
# Whitelist-based HTTP/HTTPS egress with institutional IP.

acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

acl aqne_whitelist dstdomain .aqne.jus.br
acl aqne_whitelist dstdomain .jus.br
acl aqne_whitelist dstdomain .gov.br
acl aqne_whitelist dstdomain .pje.jus.br
acl aqne_whitelist dstdomain .cnj.jus.br

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow localnet aqne_whitelist
http_access deny all

http_port 3128

coredump_dir /var/spool/squid
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

forwarded_for off
via off
visible_hostname proxy-egress.segportal.svc.cluster.local
