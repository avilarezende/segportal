name: CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.aqne.jus.br/segportal

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bandit (SAST — Python)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run Bandit
        run: |
          pip install --require-hashes -r requirements-security.lock
          bandit -q -r services --skip B101,B110,B311 -ll -f json -o bandit.json

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.lock

      - name: Install locked security tools
        run: pip install --require-hashes -r requirements-security.lock

      - name: Audit runtime dependencies (fail closed)
        run: pip-audit -r services/portal-auth/requirements.lock --disable-pip --no-deps --progress-spinner off

      - name: Ruff lint
        run: ruff check services/portal-auth tests/

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Run tests
        run: pytest -v

  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: chmod +x scripts/validate-k8s.sh && ./scripts/validate-k8s.sh

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: guacamole
            context: .
            file: services/guacamole/Dockerfile
          - service: guacd
            context: services/guacd
            file: services/guacd/Dockerfile
          - service: egress-proxy
            context: .
            file: services/egress-proxy/Dockerfile
          - service: web-browser
            context: services/web-browser
            file: services/web-browser/Dockerfile
          - service: portal-auth
            context: .
            file: services/portal-auth/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:ci

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate docker-compose
        env:
          # Valores dummy apenas para validação de sintaxe (config --quiet).
          PORTAL_SESSION_SECRET: validation-only
          GUACAMOLE_ADMIN_PASSWORD: validation-only
          SEGPORTAL_VNC_PASSWORD: validation-only
          POSTGRES_PASSWORD: ci_test_password
          VNC_PASSWORD: ci_test_vnc_password
          LDAP_HOSTNAME: ldap.aqne.jus.br
          LDAP_USER_BASE_DN: OU=Usuarios,DC=aqne,DC=jus,DC=br
          LDAP_SEARCH_BIND_DN: CN=svc-segportal,OU=Servicos,DC=aqne,DC=jus,DC=br
          LDAP_SEARCH_BIND_PASSWORD: ci_test
        run: docker compose config --quiet

      - name: Validate docker-compose.dev
        env:
          PORTAL_SESSION_SECRET: validation-only
          GUACAMOLE_ADMIN_PASSWORD: validation-only
          SEGPORTAL_VNC_PASSWORD: validation-only
          POSTGRES_PASSWORD: ci_test_password
          VNC_PASSWORD: ci_test_vnc_password
        run: docker compose -f docker-compose.dev.yml config --quiet
